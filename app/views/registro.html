{% extends "base.html" %}

{# Template casca provisorio. O front sera desenvolvido depois. #}

{% block titulo %}Criar conta{% endblock %}

{% block conteudo %}
<p><a href="{{ url_for('produtos.catalogo') }}">Voltar ao catalogo</a></p>

<h1>Criar conta</h1>
<form method="post">
  <label>Nome
    <input type="text" name="nome">
  </label>
  <label>Email
    <input type="email" name="email">
  </label>
  <label>Senha
    <input type="password" name="senha">
  </label>
  <button type="submit">Cadastrar</button>
</form>
<p>Ja tem conta? <a href="{{ url_for('auth.login') }}">Entrar</a></p>
{% endblock %}
