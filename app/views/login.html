{% extends "base.html" %}
{% import "_macros.html" as m %}
{% set ativo = "login" %}

{% block titulo %}Entrar · Dona Baunilha{% endblock %}

{% block conteudo %}
  <div class="form-estreito">
    <div class="pagina-topo pagina-topo-centro">
      <h1>Acesse sua conta</h1>
      <p>Informe seu email e sua senha para continuar.</p>
    </div>

    <form action="{{ url_for('auth.login') }}" method="post" class="form-cartao">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="next" value="{{ proximo or '' }}">

      <div class="campo">
        <label for="email">Email</label>
        <input class="entrada" type="email" id="email" name="email" required autocomplete="email"
               value="{{ email or '' }}" placeholder="voce@email.com" autofocus>
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <div class="campo-senha">
          <input class="entrada" type="password" id="senha" name="senha" required autocomplete="current-password"
                 placeholder="Sua senha">
          <button type="button" class="ver-senha" data-ver-senha="senha" aria-controls="senha"
                  aria-pressed="false" aria-label="Mostrar senha">
            <span class="ver-senha-mostrar">{{ m.icone('olho', 18) }}</span>
            <span class="ver-senha-ocultar">{{ m.icone('olho-corte', 18) }}</span>
          </button>
        </div>
      </div>

      <div class="form-acoes">
        <button type="submit" class="botao botao-primario botao-largo botao-grande">Entrar</button>
      </div>

      <p class="form-rodape-texto">
        Ainda não tem conta? <a href="{{ url_for('auth.registro') }}">Criar agora</a>
      </p>
    </form>
  </div>
{% endblock %}
